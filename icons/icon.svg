<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="8" />

  <!-- Dynamic footsteps and path trail -->
  <g filter="url(#glow)">
    <!-- Path dotted trail -->
    <path d="M120 400 C 180 340, 160 260, 240 220 S 340 160, 390 90" 
          fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="6" stroke-dasharray="10 12" stroke-linecap="round" />
          
    <!-- Left Footprint (Csámpás/dőlt lépés 1) -->
    <g transform="translate(160, 310) rotate(-18)">
      <!-- Heel -->
      <ellipse cx="28" cy="72" rx="22" ry="18" fill="url(#accentGrad)" />
      <!-- Sole -->
      <path d="M 8,46 C 4,18 20,4 34,4 C 48,4 56,18 52,46 C 50,56 12,56 8,46 Z" fill="url(#accentGrad)" />
      <!-- Toes -->
      <circle cx="16" cy="-8" r="6" fill="#34d399" />
      <circle cx="28" cy="-12" r="6.5" fill="#34d399" />
      <circle cx="40" cy="-9" r="6" fill="#34d399" />
      <circle cx="51" cy="-4" r="5" fill="#34d399" />
      <circle cx="60" cy="4" r="4.5" fill="#34d399" />
    </g>

    <!-- Right Footprint (Csámpás/dőlt lépés 2) -->
    <g transform="translate(290, 170) rotate(16)">
      <!-- Heel -->
      <ellipse cx="28" cy="72" rx="22" ry="18" fill="url(#accentGrad)" />
      <!-- Sole -->
      <path d="M 8,46 C 4,18 18,4 32,4 C 46,4 54,18 52,46 C 50,56 12,56 8,46 Z" fill="url(#accentGrad)" />
      <!-- Toes -->
      <circle cx="6" cy="4" r="4.5" fill="#34d399" />
      <circle cx="15" cy="-4" r="5" fill="#34d399" />
      <circle cx="26" cy="-9" r="6" fill="#34d399" />
      <circle cx="38" cy="-12" r="6.5" fill="#34d399" />
      <circle cx="50" cy="-8" r="6" fill="#34d399" />
    </g>
  </g>

  <!-- Energy pulse ripples -->
  <circle cx="380" cy="110" r="14" fill="#10b981" />
  <circle cx="380" cy="110" r="28" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6" />
  <circle cx="380" cy="110" r="42" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3" />
</svg>
